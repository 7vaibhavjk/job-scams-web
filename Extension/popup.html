<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 6px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }
    
    h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .url-input-section {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    
    .url-input-section h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 500;
      color: #495057;
    }
    
    .url-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    
    .url-input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }
    
    .check-url-btn {
      width: 100%;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s;
      margin-bottom: 10px;
    }
    
    .check-url-btn:hover {
      background: #218838;
    }
    
    .check-url-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    
    .check-current-url {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s;
    }
    
    .check-current-url:hover {
      background: #0056b3;
    }
    
    .check-current-url:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    
    .info {
      font-size: 12px;
      color: #6c757d;
      margin-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <h1>URL Safety Checker</h1>
  </div>
  
  <div class="url-input-section">
    <h3>Check Any URL</h3>
    <input type="url" class="url-input" id="urlInput" placeholder="Enter URL to check (e.g., https://example.com)">
    <button class="check-url-btn" id="checkUrlBtn">
      Check URL
    </button>
  </div>
  
  <button class="check-current-url" id="checkCurrentUrl">
    Check Current Page
  </button>
  
  <div class="info">
    This extension checks URLs for phishing and malicious content to help keep you safe online.
  </div>

  <script src="popup.js"></script>
</body>
</html>
